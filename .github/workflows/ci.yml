name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly proof-of-life: re-runs every gate against the current registry and
  # today's date, so the CI tile on the site stays honest during quiet periods
  # and dependency bit-rot surfaces without waiting for a commit.
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # Deterministic by design: no service keys in CI, so email uses the dev
  # stub, KV features hide, and GitHub tiles degrade — tests assert the
  # site works in exactly that state.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E + axe
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Tolerant budgets (plan §1): scores are run-to-run noisy, so we take the
  # median of 3 and hard-fail only below performance 0.90; the 95+ targets
  # surface as warnings, not pipeline failures.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse budgets
        run: npx lhci autorun

      # Publish what this run measured, even when a budget failed — a red
      # number is exactly when the panel should be showing the real one.
      # Skipped on pull requests, where fork runs have no secrets.
      - name: Publish measurements
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/publish-metrics.mjs
